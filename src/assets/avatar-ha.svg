<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#520830"/>
      <stop offset="100%" stop-color="#C0366E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="36%" r="55%">
      <stop offset="0%" stop-color="#FF80B0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="head" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </radialGradient>
    <clipPath id="c"><rect width="400" height="500"/></clipPath>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#glow)"/>
  <!-- Subtle grid texture -->
  <g opacity="0.08" clip-path="url(#c)">
    <line x1="0" y1="100" x2="400" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="400" y2="300" stroke="white" stroke-width="1"/>
    <line x1="0" y1="400" x2="400" y2="400" stroke="white" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="500" stroke="white" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="500" stroke="white" stroke-width="1"/>
  </g>
  <!-- Abstract person silhouette -->
  <circle cx="200" cy="162" r="72" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <circle cx="200" cy="162" r="52" fill="url(#head)"/>
  <path d="M88 500 Q110 340 200 300 Q290 340 312 500Z" fill="rgba(255,255,255,0.11)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <!-- Large initials -->
  <text x="200" y="188" font-family="system-ui,sans-serif" font-size="56" font-weight="700"
        fill="rgba(255,255,255,0.82)" text-anchor="middle">HA</text>
  <!-- Bottom glow for depth -->
  <ellipse cx="200" cy="500" rx="160" ry="40" fill="rgba(0,0,0,0.25)"/>
</svg>